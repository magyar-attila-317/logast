# Built-in, opinionated defaults. Every policy starts from these; company / area / service layers
# extend them (lists append, objects merge) or replace parts with `override: true`.

packs: [logging, tracing]          # metrics is opt-in: packs: [logging, tracing, metrics]

mdc:
  ambientKeys: [traceId, spanId]   # maintained by tracing, never set by hand

pii: [password, secret, token, email, phone, iban, cardNumber, cvv, pin, ssn, taxNumber, birthDate]

logging:
  protectedMessages: []            # regexes of messages alerts/dashboards depend on: reported, never rewritten
  vagueMessages:                   # MESSAGE_VAGUE: say what started / completed / failed, and to what
    - "^(processing|done|finished|start|started|end|ended|ok|success|failed|error|exception)\\.*$"
    - "^(an? )?(unexpected )?(error|exception)( happened| occurred| thrown)?\\.*$"
    - "^something went wrong"
    - "^(publishing|completed publishing|finished publishing)\\b"
    - "^(in|inside|entering|leaving|exiting) (method )?\\w+\\(?\\)?\\.*$"
  structuredFormat: ecs            # JSON console format written to application.yml: ecs, logstash, gelf; none = leave it
  keyStyle: camel                 # MDC and [k=v] keys (vocabulary keys too): camel (orderId, default), dotted (order.id),
                                   # pascal (OrderId), snake (order_id), keep. Also the spelling `logast vocabulary` proposes.

# One way to say lifecycle events. "{subject}" is what happens, in domain terms ("Order sync").
# Existing messages matching a variant are rewritten to the canonical form; new text written for an entry log
# must use "started", for a swallowed exception "failed".
phrasing:
  events:
    started:
      canonical: "{subject} started"
      variants: ["starting {subject}", "started {subject}", "initiating {subject}", "initializing {subject}",
                 "kicking off {subject}", "beginning {subject}", "about to {subject}", "{subject} starting",
                 "{subject} begins", "{subject} initiated"]
    completed:
      canonical: "{subject} completed"
      variants: ["finished {subject}", "completed {subject}", "done {subject}", "{subject} finished", "{subject} done", "{subject} complete", "{subject} succeeded",
                 "{subject} successful", "{subject} successfully completed", "{subject} ended"]
    failed:
      canonical: "{subject} failed"
      variants: ["failed to {subject}", "could not {subject}", "couldn't {subject}", "unable to {subject}",
                 "error while {subject}", "error during {subject}", "error in {subject}", "exception in {subject}",
                 "exception while {subject}", "{subject} error", "{subject} unsuccessful", "{subject} has failed"]
    skipped:
      canonical: "{subject} skipped"
      variants: ["skipping {subject}", "{subject} ignored", "ignoring {subject}"]
    retrying:
      canonical: "{subject} retrying"
      variants: ["retrying {subject}", "will retry {subject}", "{subject} will be retried", "re-trying {subject}"]

levels:
  # Caller/client errors are expected outcomes: WARN at most, never ERROR (ERROR = someone must act).
  clientErrors:
    - jakarta.validation.ConstraintViolationException
    - jakarta.validation.ValidationException
    - org.springframework.web.bind.MethodArgumentNotValidException
    - org.springframework.web.method.annotation.HandlerMethodValidationException
    - org.springframework.http.converter.HttpMessageNotReadableException
    - org.springframework.web.HttpRequestMethodNotSupportedException
    - org.springframework.web.servlet.resource.NoResourceFoundException
    - org.springframework.security.access.AccessDeniedException
    - org.springframework.security.core.AuthenticationException
    - org.springframework.dao.EmptyResultDataAccessException
    - jakarta.persistence.EntityNotFoundException
  clientErrorLevel: warn
  # INFO once per item of a loop. size: fine for small loops (fixed lists, up to boundedLoopMax items, or a
  # `// logast:loop-size 10` hint above the loop); lowered to DEBUG for loops over query/stream data (database rows,
  # file lines, Kafka batches, or a `// logast:loop-size large` hint); reported where the size is unknown.
  # never: always DEBUG unless known small. always: no loop checks.
  infoInLoops: size
  boundedLoopMax: 20
  # A database read returning more rows than this gets a WARN line (DB_OUTCOME_UNLOGGED). 0 = no check.
  largeResult: 10000

metrics:
  events: true                     # business events (lifecycle log messages) without a metric get an Observation
  tags:                            # tag vocabulary: aliases are renamed to the key (METRIC_TAG_KEY)
    outcome:
      aliases: [result, success, succeeded]
      # values: [success, failure]   # optional: allowed literal values (METRIC_TAG_VALUE)

resilience:                        # opt-in pack: packs: [..., resilience]
  httpConnectTimeout: 5s           # written to spring.http.clients.* by HTTP_CLIENT_NO_TIMEOUT
  httpReadTimeout: 30s

audit:                             # opt-in pack: packs: [..., audit]
  emitters: []                     # e.g. [com.example.audit.AuditService, com.example.ActivityLogger#log];
                                   # empty: any call on a *Audit* type or with an *Audit* argument (AuditAction enum)
  actions:                         # entrypoints that must record an audit event (any field matches)
    - http: "DELETE **"
    - http: "* /admin/**"
    - http: "* /api/admin/**"
    - method: "(?i)(export|delete|remove|grant|revoke|refund|void|approve|reject|reset|disable|enable|impersonate|assign|unassign)[A-Z_].*|(?i)(export|delete|refund|approve|reject|impersonate)"
