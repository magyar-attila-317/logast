# $schema: ./vocabulary-worksheet.schema.json
# logast vocabulary worksheet: every MDC / [k=v] key the services use, and where.
#
# What to do: under each key that has "# decide:" lines, uncomment ONE of them (the first one is
# logast's suggestion), then run:
#     `logast vocabulary --central <this folder> <service>…`
# It keeps your decisions, refreshes the rest and publishes the decided terms to company.yaml next to this
# file. Services that extend company.yaml get the renames on their next `logast apply`.
#
#   term: order        this key is a company-wide term (here: "order"), and the key is its name in logs
#   same_as: orderId   the same value as the key orderId: apply renames this key to orderId's
#   local: true        only for its own service: not published
# Optional next to term: owner: <team> (who to ask), area: <name> (published under areas.<name>).
# Per area (section `areas`), packages: [..] is yours to set too. Everything else is rewritten on each run.
#
# Summary of this run:
#   services: 3 (billing, ledger, shipping), keys: 4, decided: 3
#   to decide: 1 (0 new): customerId
#   decided, no service uses it any more: -
#   still used against a decision:
#     order_id (same_as orderId) still in shipping: apply renames it in services that extend company.yaml
#   areas: bookkeeping (0 terms; in the logast.yaml of ledger), orders (1 term)
areas:
  bookkeeping:
    known_in:
      - {service: "ledger", packages: [com.example.ledger], requiredMdc: [entryId]}
  orders:
    packages: [com.example.billing, com.example.shipping]
    terms: [order]
keys:
  customerId:
    # term: customer   # decide: a company-wide term; customerId is its key in logs
    # local: true      # decide: not published
    services: [ledger, shipping]
    types: ["Long", "String"]
    warning: "one name, different types: Long (ledger), String (shipping): possibly NOT the same value; if so, give one of them another key"
    evidence:
      - {service: "ledger", at: "src/main/java/com/example/ledger/EntryBook.java:10", use: kv, value: "customerId", type: "Long"}
      - {service: "shipping", at: "src/main/java/com/example/shipping/ParcelDispatch.java:12", use: kv, value: "customerId", type: "String"}
  entryId:
    local: true
    services: [ledger]
    types: ["Long"]
    evidence:
      - {service: "ledger", at: "src/main/java/com/example/ledger/EntryBook.java:10", use: kv, value: "entryId", type: "Long"}
  orderId:
    term: order
    owner: "order team"
    area: orders
    services: [billing]
    types: ["Long"]
    evidence:
      - {service: "billing", at: "src/main/java/com/example/billing/InvoiceDesk.java:11", use: mdc, value: "String.valueOf(order.id())", from: "Order.id()", type: "Long"}
      - {service: "billing", at: "src/main/java/com/example/billing/InvoiceDesk.java:12", use: kv, value: "order.id()", from: "Order.id()", type: "Long"}
  order_id:
    same_as: orderId
    services: [shipping]
    types: ["Long"]
    evidence:
      - {service: "shipping", at: "src/main/java/com/example/shipping/ParcelDispatch.java:11", use: mdc, value: "String.valueOf(order.id())", from: "Order.id()", type: "Long"}
