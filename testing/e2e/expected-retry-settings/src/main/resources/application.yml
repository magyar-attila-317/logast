spring:
  application:
    name: e2e-shop
    version: ${APPLICATION_VERSION:unknown}
  jdbc:
    template:
      query-timeout: 5m
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 30s
  kafka:
    listener:
      observation-enabled: true
  rabbitmq:
    listener:
      simple:
        observation-enabled: true
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service:
          name: ${spring.application.name}
          version: ${spring.application.version}
logging-support:
  log-defaults:
    enabled: true
  mdc-hygiene:
    enabled: true
  context-propagation:
    enabled: true
  batch-trace:
    enabled: true
management:
  metrics:
    tags:
      application: ${spring.application.name}
      version: ${spring.application.version}
  opentelemetry:
    resource-attributes:
      service:
        version: ${spring.application.version}
resilience:
  retry:
    defaults:
      max-retries: 2
      delay: 500ms
    spring-retry-defaults:
      max-attempts: 4
      delay: 200
      multiplier: 1.5
    usages:
      parcel-client:
        label:
          max-retries: 5
          delay: 2000ms
          multiplier: 2.0
      parcel-gateway:
        cancel:
          max-attempts: 3
          delay: 1000
