# $schema: .logast/schemas/logast.schema.json
# yaml-language-server: $schema=.logast/schemas/logast.schema.json
# =============================================================================================
# logast.yaml: how this service should log, trace and measure
#
# logast reads this file on every run. Anything you leave out uses the built-in default.
# Lines starting with "#" are switched-off examples: remove the "#" to use one.
#
# Handy commands
#   logast explain policy .         the final settings (this file + extends + defaults)
#   logast vocabulary .             business ids in the code that are not listed below yet
#   logast scan . --format summary  what logast would change
#
# Every option, explained: https://github.com/magyar-attila-317/logast/blob/main/docs/configuration.md
# =============================================================================================

# Shared settings for all your services (a URL or a file). Lists add up; this file wins on conflicts.
# extends: [https://git.example.com/platform/observability/raw/main/company.yaml]

# Which checks run. Default: all of them. Leave one out to switch it off.
packs: [logging, tracing, metrics, resilience, errors, audit]

logging:
  # How MDC keys and [key=value] keys are spelled: camel (orderId), dotted (order.id), pascal (OrderId),
  # snake (order_id). Applies to the vocabulary below too.
  keyStyle: camel
  # true: logast may reword existing messages. false: keep their words, fix only the structure.
  rewriteExistingMessages: true
  # JSON log format (logging.structured.format.console): ecs, logstash or gelf, whichever your log
  # backend reads. none: logast leaves the log format alone.
  structuredFormat: ecs   # what this service already uses
  # Messages that alerts or dashboards search for (regex): logast never changes them, it only reports.
  # protectedMessages: ["^ALERT:"]
  # How a caught exception is logged: exceptionStack attach (the default) passes it to the logger with
  # its stack trace, never logs its class only; exceptionMessage keep (the default) or never (its class
  # instead: a message may hold personal data).
  # exceptionStack: never
  # exceptionMessage: never

# Callers' trace context (traceparent, baggage): true continues their traces (services behind one
# gateway share one trace); false for a service the internet reaches directly, where a caller could
# pick the trace id it logs under. Written out so a changed default never changes this service.
entrypoints:
  trustInboundTrace: true

# Share of traces exported (management.tracing.sampling.probability). Unset: only proposed.
# tracing:
#   samplingProbability: 1.0

# Where generated code gets MdcScope / ObservedContext from:
#   vendor      copies the classes into this service, no library needed (the default)
#   dependency  adds the logging-support library (it must be in a repository your build uses; the
#               default when an extended policy sets support.repository)
# support:
#   mode: dependency

# ---------------------------------------------------------------------------------------------
# Business vocabulary: one entry per business concept
#
# logast puts each id into MDC where a flow starts (endpoint, listener, job) and removes it from
# the messages below that point, because every log line already carries it.
#   aliases       other words for the same thing; rewritten to the term in messages
#   mdc.key       the MDC key for the id; mdc.aliases are old key names, renamed to mdc.key
#   mdc.sources   where the id comes from: parameter names, or "com.x.Type: accessor()"
#
# The entries below were found in your code, one per key as the code spells it. Organise them as
# the example shows, then run `logast vocabulary .` again: it lists only what is still missing.
# ---------------------------------------------------------------------------------------------
# Harvested from 57 source files: MDC keys, [k=v] keys in log messages and id-like variables,
# one term per key, written as in the code. Counts: mdc / log / declared, files. "same value as" and
# "a kind of" are only hints: nothing is merged or renamed until you edit it.
#
# How to organise it (https://github.com/magyar-attila-317/logast/blob/main/docs/vocabulary.md):
# a term is the business word, its mdc.key the key every log line carries.
#   order:                             # renamed from orderId: name the term with the business word
#     aliases: [purchase]              # banned words: "purchase" in a message becomes "order"
#     mdc: { key: orderId, aliases: [order_id, orderUuid] }  # same value: its other spellings merged
#   supplier:                          # supplierId and supplierNumber are two values: two terms
#     mdc: { key: supplierId }
#   supplierNumber:
#     mdc: { key: supplierNumber }
#   approver:                          # a role: another field of the same kind as userId,
#     mdc: { key: approverUserId }     # so its own term, never an alias of it
# Delete the keys that are not business terms (technical ones like retryCount).
vocabulary:
  pledgeId:      # 0 / 32 / 29, 22 files
    mdc: { key: pledgeId, sources: { params: [pledgeId] } }
  runCode:       # 1 / 5 / 0, 2 files
    mdc: { key: runCode }
  orderId:       # 0 / 3 / 2, 3 files
    mdc: { key: orderId, sources: { params: [orderId] } }
  sponsorshipId: # 0 / 2 / 1, 2 files
    mdc: { key: sponsorshipId, sources: { params: [sponsorshipId] } }
  tableId:       # 0 / 1 / 1, 2 files
    mdc: { key: tableId, sources: { params: [tableId] } }
  batchNumber:   # 0 / 1 / 0, 1 file
    mdc: { key: batchNumber }

# ---------------------------------------------------------------------------------------------
# More options (remove the "#" to use one)
# ---------------------------------------------------------------------------------------------

# Areas: packages where a word means something else, or where extra MDC keys are required.
# areas:
#   billing:
#     packages: [com.example.billing]
#     requiredMdc: [tenantId]

# Personal data: values with these names never reach a log line or a metric tag (adds to the built-ins).
# pii: [guestName, guestPhone]

# Exceptions caused by the caller (logged at WARN at most, never ERROR). Adds to the built-in list.
# levels:
#   clientErrors: [com.example.e2e.pledge.PledgeMissing]   # found: @ResponseStatus 4xx, 4xx handlers in the code
#   infoInLoops: size            # INFO per loop item: fine when small, DEBUG over database rows/streams,
#                                # reported when unknown (`// logast:loop-size 10` above a loop settles it)

# Your own annotations that start work, like @KafkaListener does (under entrypoints: above).
#   extraAnnotations: [com.example.InboxHandler]

# Gradle tasks that run the tests, for `logast verify` (default: test).
# verify:
#   tasks: [test, intTest]

# Turn single rules off or change how serious they are (`logast explain rules` lists all of them).
# rules:
#   ENTRYPOINT_SILENT: { severity: low }
#   LOG_IN_LOOP: { enabled: false }

# The metrics, resilience and audit packs have their own settings: see the guide linked at the top.

# ---------------------------------------------------------------------------------------------
# Every setting with its built-in default; [example] marks a value that only shows the form.
# Copy a line above the dashes and remove the # to change it.
# The IDE completes and checks this file against .logast/schemas/logast.schema.json.
# ---------------------------------------------------------------------------------------------
# packs: [logging, tracing, metrics, resilience, errors, audit]   # Which checks run; replaces the list of earlier layers (audit | errors | logging | metrics | resilience | tracing)
# vocabulary: {order: {aliases: [purchase], mdc: {key: orderId, sources: {params: [orderId]}}}}   # [example] Your business words: one entry per concept, keyed by the word your logs use. `logast vocabulary .` lists …
# areas:   # Parts of the code where a word means something else
# mdc:   # MDC keys
#   ambientKeys: [traceId, spanId]   # Keys tracing maintains: never set by hand, never renamed
#   extractRepeated: 2   # An id logged by this many lines of one method goes into MDC once (0 = off)
# pii: [password, secret, token, email, phone, iban, cardNumber, cvv, pin, ssn, taxNumber, birthDate]   # Value names that are personal data: removed from log lines and refused as metric tags (added to the …
# entrypoints:   # Where work starts
#   extraAnnotations: [com.example.InboxHandler]   # [example] Your own annotations that start work (like @KafkaListener)
#   includeMain: false   # Treat main() as an entrypoint (command-line tools)
#   kafkaObservationEnabled:   # Set when the service switches on Kafka observation itself (spring.kafka.template.observation-enabled)
#   trustInboundTrace: true   # true: continue callers' traces (traceparent, baggage); false for a service the internet reaches directly
# logging:   # Message format and wording
#   keyStyle: camel   # How MDC and [k=v] keys are spelled; applies to vocabulary keys too (camel | dotted | pascal | snake | keep)
#   rewriteExistingMessages: true   # false: keep the words of existing messages, fix only their structure
#   structuredFormat: logstash   # JSON console log format logast writes to application.yml; none leaves the log format alone (logstash | ecs | gelf | none)
#   structuredProfiles: []   # Profiles that get JSON console logs (application-<profile>.yml); empty: every profile
#   serviceName: "${SERVICE_NAME:shop}"   # [example] Written to spring.application.name when missing (default: the project name)
#   serviceVersion: "${APPLICATION_VERSION:unknown}"   # [example] Written to spring.application.version when missing
#   loggerName: log   # Field name of a logger logast adds
#   entryLevel: info   # Level of the "X started" line logast adds to a silent entrypoint (trace | debug | info | warn | error)
#   minEntrypointLevel: info   # An entrypoint with nothing logged at this level or above is silent (trace | debug | info | warn | error)
#   swallowedLevel: warn   # Level of a line added to a catch that drops its exception (trace | debug | info | warn | error)
#   exceptionStack: attach   # attach: pass the caught exception to the logger; never: log its class only ([errorType=…]) (attach | never)
#   exceptionMessage: keep   # keep: e.getMessage() may stay in log lines; never: its class instead (a message may hold personal data) (keep | never)
#   wordingQueue: 50   # messages.yaml asks for at most this many texts at once, the most severe first
#   protectedMessages: []   # Messages alerts or dashboards depend on (regex): never reworded, only reported
#   vagueMessages: [^handled\.?$]   # [example] Wording to avoid (regex, added to the built-in list): MESSAGE_VAGUE
# phrasing:   # One way to say lifecycle events
#   events: {completed: {variants: ["{subject} wrapped up"]}}   # [example] Event → its canonical form and the variants rewritten to it
# levels:   # Log levels
#   clientErrors: [com.example.BusinessRuleViolationException]   # [example] Exceptions caused by the caller (added to the built-in list): never logged as ERROR
#   clientErrorLevel: warn   # The level for client errors (trace | debug | info | warn | error)
#   infoInLoops: size   # INFO once per loop item. size: fine for small loops, DEBUG over query/stream data, reported when unknown; … (size | never | always)
#   boundedLoopMax: 20   # A loop over at most this many items counts as small
#   volumeBudget: 100000.0   # Log lines per day one statement may produce (with traffic numbers)
#   addedInfoMaxPerDay: 1000.0   # A line logast adds for a request or a write is INFO only up to this rate
#   jobInfoMaxPerDay: 24.0   # Runs per day up to which the started/completed lines logast adds to a @Scheduled job are INFO; a job that …
#   expectedExceptions: [Conflict, Rejected, Rejection, NotFound, Invalid, Validation, Duplicate, AlreadyExists, Forbidden, Unauthorized, BadRequest, StateConflict, NotAllowed, Denied]   # Words in an exception's class name that make it an expected outcome (a business signal): an existing WARN …
# tracing:   # Tracing
#   samplingProbability: 1.0   # [example] Written into management.tracing.sampling.probability when the service sets none; unset: only proposed
# support:   # The runtime helper library (MdcScope, ObservedContext, Outcomes)
#   mode:   # vendor: copy its classes into the service; dependency: add the logging-support library (default when … (vendor | dependency)
#   coordinates: "dev.logast:logging-support:0.5.9"   # [example] Which library (dependency mode); default: this logast's version
#   repository: "https://nexus.example.com/repository/maven-releases/"   # [example] Where the library comes from: added to the build unless a script names it
#   vendorPackage: com.example.shop.logging   # [example] Where vendor mode copies the classes (default: <app package>.logging)
#   packageName: dev.logast.logging   # [example] The library's package (for a renamed fork)
# metrics:   # Metrics (pack metrics)
#   events: true   # Business events without a metric get an Observation (timer, count, span)
#   defaults: [failures, jobs, skips, db-writes]   # Logged outcomes counted without a metrics.yaml decision; [] = only what metrics.yaml decides (failures | jobs | skips | db-writes)
#   amounts: total   # A number on an outcome line counted too: total (a counter grows by it), per-run (a distribution), off (an … (total | per-run | off | false)
#   catalog: per-package   # Metric names in one place: per-package (an XMetrics class per package), single (all in catalogClass), off … (per-package | single | off | false)
#   catalogClass: com.example.metrics.BusinessMetrics   # [example] The class for catalog: single (default: <app package>.metrics.BusinessMetrics)
#   tags: {outcome: {aliases: [result, success, succeeded]}}   # [example] Tag vocabulary: tag key → aliases renamed to it and allowed values
#   nonProductionProfiles: [test, tests, e2e, it, dev, local, demo, seed, seeder, testdata, mock, fake, stub, integration-test, integrationtest]   # Profiles (and property prefixes of @ConditionalOnProperty / @ConditionalOnExpression) that never run in …
#   genericWords: [line, item, row, record, entry, value, data, request, response, message, event, task, call, communicate, process, handle, send, receive, run, execute, update, check, give, sync, operation, action, step, result, submit, read, queue, publish, print, price, persist, mark, nudge, close, open, write, parse, load, save, fetch, notify, release, cancel, retry, refresh, apply, resolve, validate, render, convert, delete, create, start, stop, poll, consume, emit, store, lookup, build, compute, deliver]   # Words that make no metric name on their own: a name of only one of them gets its class's subject first …
#   familyVerbs: [handle, process, parse, write, read, run, execute, do, perform, get, set, update, check, validate, load, save]   # Outcomes whose metric names start with one of these share no metric: everything handled is no family. A …
# resilience:   # Timeouts and locks (pack resilience): a timeout is written only when this file or a layer it extends sets it
#   httpConnectTimeout: 5s   # Written to spring.http.clients.connect-timeout when a service has none
#   httpReadTimeout: 30s   # Written to spring.http.clients.read-timeout
#   dbQueryTimeout: 5m   # Written to spring.jdbc.template.query-timeout and the JPA query timeout
#   singleInstance: false   # true: the service never runs more than once, @Scheduled jobs need no lock
# audit:   # Audit records (pack audit)
#   emitters: []   # Calls that record an audit event: a class, or class#method; empty: calls on *Audit* types
#   logger: audit   # Audit classes log through this logger name (AUDIT_LOG_MIXED)
#   actions:   # Entrypoints that must record an audit event; any field matches
# reporting:   # What scan writes besides the findings
#   sourceComments: false   # true: "// logast: RULE ID" beside findings that need an entry in messages.yaml or metrics.yaml (a …
# queries:   # What .logast/reports/queries.md holds
#   backends: [prometheus, newrelic, splunk]   # Query languages to write (prometheus | newrelic | splunk)
#   splunk:   # Splunk
#     index: ""   # The index the service logs to; empty: no Splunk queries
#     sourcetype: ""   # Added to every search
#   prometheus:   # Prometheus
#     serviceLabel: ""   # The label that names the service (default: application when management.metrics.tags.application is set, …
# verify:   # logast verify
#   tasks: [test, intTest]   # [example] Gradle tasks that run your tests (default: test)
#   gradleDir: ../..   # [example] Run Gradle here, relative to the service
# rules: {LOG_IN_LOOP: {enabled: false}, ENTRYPOINT_SILENT: {severity: low}}   # [example] Switch single rules off or change their severity: rule id → setting (`logast explain rules` lists them)
