logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service:
          name: ${spring.application.name}
          version: ${spring.application.version}
logging-support:
  log-defaults:
    enabled: true
  mdc-hygiene:
    enabled: true
  context-propagation:
    enabled: true
  batch-trace:
    enabled: true
spring:
  jdbc:
    template:
      query-timeout: 5m
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 30s
  kafka:
    listener:
      observation-enabled: true
  rabbitmq:
    listener:
      simple:
        observation-enabled: true
  application:
    name: billing-service
    version: ${APPLICATION_VERSION:unknown}
management:
  metrics:
    tags:
      application: ${spring.application.name}
      version: ${spring.application.version}
  opentelemetry:
    resource-attributes:
      service:
        version: ${spring.application.version}
  tracing:
    sampling:
      probability: 1.0
