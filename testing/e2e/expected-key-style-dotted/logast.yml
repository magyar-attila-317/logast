# $schema: .logast/schemas/logast.schema.json
# yaml-language-server: $schema=.logast/schemas/logast.schema.json
# e2e golden project: the shapes real services showed (see cli/src/test/.../E2eGoldenTest)
packs: [logging, tracing, metrics, resilience, errors, audit]
logging:
  keyStyle: dotted
  structuredFormat: logstash
support:
  mode: vendor
vocabulary:
  pledge:
    mdc:
      key: pledgeId
      sources:
        params: [pledgeId]
  order:
    mdc:
      key: orderId
      sources:
        params: [orderId]
        types:
          com.example.e2e.order.Order: "id()"
  sponsorship:
    mdc:
      key: sponsorshipId
      sources:
        params: [sponsorshipId]
# the team's timeouts: written by the resilience pack (#271; without them it only proposes)
resilience:
  httpConnectTimeout: 5s
  httpReadTimeout: 30s
  dbQueryTimeout: 5m
