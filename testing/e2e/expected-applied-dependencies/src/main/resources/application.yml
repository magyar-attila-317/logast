spring:
  application:
    name: e2e-shop
    version: ${APPLICATION_VERSION:unknown}
  jdbc:
    template:
      query-timeout: 5m
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 30s
  kafka:
    listener:
      observation-enabled: true
  rabbitmq:
    listener:
      simple:
        observation-enabled: true
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service:
          name: ${spring.application.name}
          version: ${spring.application.version}
management:
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    propagation:
      consume: []
      produce: [w3c]
    baggage:
      enabled: false
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}
      version: ${spring.application.version}
  opentelemetry:
    resource-attributes:
      service:
        version: ${spring.application.version}
logging-support:
  log-defaults:
    enabled: true
  mdc-hygiene:
    enabled: true
  context-propagation:
    enabled: true
  batch-trace:
    enabled: true
