# #9: logast on public Spring Boot services (testing/corpus/corpus.yaml), cloned at pinned commits. It runs their Gradle builds
# (third-party build scripts), so it runs here on a throwaway runner, on demand (owner: no nightly run), and locally
# only by choice (./gradlew :cli:corpus); not on every push (minutes per service).
name: corpus

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Services to run (comma-separated names from testing/corpus/corpus.yaml); empty: all'
        required: false
        default: ''
      update:
        description: 'Rewrite the decision baselines (#328): download them from the corpus-report artifact and commit them'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Migrate the corpus
        run: ./gradlew :cli:corpus --console=plain ${{ inputs.only != '' && format('-Pcorpus.only={0}', inputs.only) || '' }} ${{ inputs.update && '-Pcorpus.updateDecisions' || '' }}
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report
          path: |
            modules/cli/build/reports/tests/corpus
            testing/corpus/decisions
