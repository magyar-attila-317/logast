# Unit build and the e2e matrix (#73), from a clean checkout: Linux on every push and PR; macOS (#8) nightly and on
# demand (Run workflow; the nightly run only after a day with commits), as its problems come from the environment rather than from one commit, and its minutes cost ten
# times Linux's. A newer push cancels the run of an older one on the same branch.
name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # the nightly run builds only when main got commits in the last 24 hours; every other trigger always builds
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      e2e: ${{ steps.check.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          # a push that changes only text (*.md, docs/) builds but skips the e2e matrix: no scenario reads them
          e2e=true
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$before^{commit}" 2>/dev/null \
              && ! git diff --name-only "$before" HEAD | grep -qvE '(\.md$|^docs/)'; then e2e=false; fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          echo "newest commit is ${age}s old"
          echo "run=$([ "$age" -lt 86400 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: ./gradlew build -x :cli:e2e -x :cli:e2eJdk21 --console=plain

  # one job per shard (E2eShard0..7) and JDK: a runner has 4 cores, so one job ran four shards two at a time
  # (40 minutes); four shards per JDK took 17, eight about 10
  e2e:
    name: e2e (${{ matrix.task }}, shard ${{ matrix.shard }}, ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.e2e == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
        task: [e2e, e2eJdk21]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
        exclude:
          # JDK 21 checks javac's type attribution, which does not depend on the OS: Linux covers it
          - os: macos-latest
            task: e2eJdk21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Golden e2e scenarios
        run: ./gradlew :cli:${{ matrix.task }} --tests "dev.logast.cli.E2eShard${{ matrix.shard }}" -Pe2e.forks=1 --console=plain
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.task }}-${{ matrix.shard }}-${{ matrix.os }}
          path: modules/cli/build/reports/tests/${{ matrix.task }}
