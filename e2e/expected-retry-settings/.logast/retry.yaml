# Retry settings per @Retryable usage (optional). By default a usage reads the shared block of its kind in
# application.yml: resilience.retry.defaults (Spring Framework) or resilience.retry.spring-retry-defaults
# (Spring Retry). specific: true gives it its own block, resilience.retry.usages.<class>.<method>, starting
# from the shared values or from values: given here; the next `logast apply` moves it. false points it back to
# the shared block (its own block stays in application.yml, unused). Empty: logast decides (a usage whose
# settings differ from the shared ones keeps them in a block of its own).
usages:
  ParcelClient.track:    # Spring Framework @Retryable, src/main/java/com/example/e2e/parcel/ParcelClient.java:11
    specific: false
  ParcelClient.quote:    # Spring Framework @Retryable, src/main/java/com/example/e2e/parcel/ParcelClient.java:16
    specific: false
  ParcelClient.label:    # Spring Framework @Retryable, src/main/java/com/example/e2e/parcel/ParcelClient.java:21
    specific: true
  ParcelGateway.send:    # Spring Retry @Retryable, src/main/java/com/example/e2e/parcel/ParcelGateway.java:10
    specific: false
  ParcelGateway.cancel:    # Spring Retry @Retryable, src/main/java/com/example/e2e/parcel/ParcelGateway.java:15
    specific: true
