spring:
  application:
    name: e2e-shop
    version: ${APPLICATION_VERSION:unknown}
  jdbc:
    template:
      query-timeout: 5m
  kafka:
    listener:
      observation-enabled: true
  rabbitmq:
    listener:
      simple:
        observation-enabled: true
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service:
          name: ${spring.application.name}
          version: ${spring.application.version}
logging-support:
  problem-trace-id:
    enabled: true
management:
  metrics:
    tags:
      application: ${spring.application.name}
      version: ${spring.application.version}
  opentelemetry:
    resource-attributes:
      service:
        version: ${spring.application.version}
  tracing:
    sampling:
      probability: 1.0
