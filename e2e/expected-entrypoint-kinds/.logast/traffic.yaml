# Calls per day for each entrypoint, from production (e.g. Prometheus:
#   sum by (method, uri) (increase(http_server_requests_seconds_count[1d])) ).
# Leave a value empty when you don't know it: logast never estimates traffic.
# Regenerate with `logast traffic <root>`: filled-in values are kept, new entrypoints are added.
entrypoints:
  # http
  "DELETE /pledge-routes/{pledgeId}":     # http, PledgeRouteHandler.remove
  "DELETE /pledges/{pledgeId}":     # http, PledgeController.delete
  "GET /audit/settings":     # http, AuditController.settings
  "GET /pledge-routes/{pledgeId}":     # http, PledgeRouteHandler.show
  "GET /pledges":     # http, PledgeController.open
  "GET /pledges/{pledgeId}/details":     # http, PledgeDetailsController.details
  "GET /quotes/{productId}":     # http, QuoteController.quote
  "GET /quotes/{productId}/refresh":     # http, QuoteController.refresh
  "POST /admin/pledges/{pledgeId}/revoke":     # http, PledgeController.revoke
  "POST /pledge-routes":     # http, PledgeRouteHandler.register
  "POST /pledges/allot":     # http, PledgeController.allot
  "POST /pledges/{pledgeId}/hold":     # http, PledgeDetailsController.hold
  "POST /pledges/{pledgeId}/publish":     # http, PledgeController.publish
  "POST /pledges/{pledgeId}/use":     # http, PledgeController.use
  "POST /orders":     # http, PledgeController.place
  "PUT /pledge-routes/{pledgeId}":     # http, PledgeRouteHandler.replace
  # scheduled
  "@Scheduled PledgeCleanupJob.cleanup":     # scheduled, PledgeCleanupJob.cleanup
  "@Scheduled PledgeReloadJob.run":     # scheduled, PledgeReloadJob.run
  "@Scheduled EdgeJob.run":     # scheduled, EdgeJob.run
  # kafka
  "@KafkaListener pledge-batches":     # kafka, PledgeMessages.onBatch
  "@KafkaListener orders":     # kafka, OrderEvents.onOrder
  # jms
  "@JmsListener pledge-audits":     # jms, PledgeMessages.onAudit
  # rabbit
  "@RabbitListener pledge-returns":     # rabbit, PledgeMessages.onReturn
  # step
  "tasklet PledgeImportTasklet.execute":     # step, PledgeImportTasklet.execute
  # item
  "item processor OrderLineProcessor.process":     # item, OrderLineProcessor.process
  # sqs
  "@SqsListener pledge-bulk":     # sqs, PledgeQueueListener.onBulk
  "@SqsListener pledge-requests":     # sqs, PledgeQueueListener.onRequest
  # stream
  "stream pledgeNormalizer-in-0":     # stream, CodeNormalizer.normalize
  "stream orderIntake-in-0":     # stream, OrderDesk.accept
  # in-process event listeners: their rate follows whoever publishes the event (fill only if you know it)
  "@EventListener SettlementJobExecutor.onReady(ApplicationReadyEvent)":     # event, SettlementJobExecutor.onReady
  "@TransactionalEventListener OrderLedger.onSettled(Order)":     # event, OrderLedger.onSettled
  "@TransactionalEventListener OrderNotifications.onCommitted(OrderPlaced)":     # event, OrderNotifications.onCommitted
