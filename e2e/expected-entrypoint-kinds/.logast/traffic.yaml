# Calls per day for each entrypoint, from production (e.g. Prometheus:
#   sum by (method, uri) (increase(http_server_requests_seconds_count[1d])) ).
# Leave a value empty when you don't know it: logast never estimates traffic.
# Regenerate with `logast traffic <root>`: filled-in values are kept, new entrypoints are added.
entrypoints:
  # http
  "DELETE /coupon-routes/{couponId}":     # http, CouponRouteHandler.remove
  "DELETE /coupons/{couponId}":     # http, CouponController.delete
  "GET /audit/settings":     # http, AuditController.settings
  "GET /coupon-routes/{couponId}":     # http, CouponRouteHandler.show
  "GET /coupons":     # http, CouponController.open
  "GET /coupons/{couponId}/details":     # http, CouponDetailsController.details
  "GET /quotes/{productId}":     # http, QuoteController.quote
  "GET /quotes/{productId}/refresh":     # http, QuoteController.refresh
  "POST /admin/coupons/{couponId}/revoke":     # http, CouponController.revoke
  "POST /coupon-routes":     # http, CouponRouteHandler.register
  "POST /coupons/redeem":     # http, CouponController.redeem
  "POST /coupons/{couponId}/hold":     # http, CouponDetailsController.hold
  "POST /coupons/{couponId}/publish":     # http, CouponController.publish
  "POST /coupons/{couponId}/use":     # http, CouponController.use
  "POST /orders":     # http, CouponController.place
  "PUT /coupon-routes/{couponId}":     # http, CouponRouteHandler.replace
  # scheduled
  "@Scheduled CouponCleanupJob.cleanup":     # scheduled, CouponCleanupJob.cleanup
  "@Scheduled CouponReloadJob.run":     # scheduled, CouponReloadJob.run
  "@Scheduled EdgeJob.run":     # scheduled, EdgeJob.run
  # kafka
  "@KafkaListener coupon-batches":     # kafka, CouponMessages.onBatch
  "@KafkaListener orders":     # kafka, OrderEvents.onOrder
  # jms
  "@JmsListener coupon-audits":     # jms, CouponMessages.onAudit
  # rabbit
  "@RabbitListener coupon-returns":     # rabbit, CouponMessages.onReturn
  # step
  "tasklet CouponImportTasklet.execute":     # step, CouponImportTasklet.execute
  # item
  "item processor OrderLineProcessor.process":     # item, OrderLineProcessor.process
  # sqs
  "@SqsListener coupon-bulk":     # sqs, CouponQueueListener.onBulk
  "@SqsListener coupon-requests":     # sqs, CouponQueueListener.onRequest
  # stream
  "stream couponNormalizer-in-0":     # stream, CodeNormalizer.normalize
  "stream orderIntake-in-0":     # stream, OrderDesk.accept
  # in-process event listeners: their rate follows whoever publishes the event (fill only if you know it)
  "@EventListener SettlementJobExecutor.onReady(ApplicationReadyEvent)":     # event, SettlementJobExecutor.onReady
  "@TransactionalEventListener OrderLedger.onSettled(Order)":     # event, OrderLedger.onSettled
  "@TransactionalEventListener OrderNotifications.onCommitted(OrderPlaced)":     # event, OrderNotifications.onCommitted
