# e2e golden project: the shapes real services showed (see cli/src/test/.../E2eGoldenTest)
packs: [logging, tracing, metrics, resilience, errors, audit]
logging:
  keyStyle: camel
  structuredFormat: logstash
support:
  mode: vendor
audit:
  actions:
    - http: "POST /lockers/*/open"
vocabulary:
  locker:
    mdc:
      key: lockerId
      sources:
        params: [lockerId]
  pledge:
    mdc:
      key: pledgeId
      sources:
        params: [pledgeId]
  order:
    mdc:
      key: orderId
      sources:
        params: [orderId]
        types:
          com.example.e2e.order.Order: "id()"
  sponsorship:
    mdc:
      key: sponsorshipId
      sources:
        params: [sponsorshipId]
