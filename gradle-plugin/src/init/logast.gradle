// logast init script: applies the dev.logast plugin to every Java project (install.sh replaces this file only while this line is first)
//
// Lets `./gradlew logastApply` (logastScan, logastCheck, ...) run in any service without a plugins { id("dev.logast") }
// line in its build. Installed by logast's install.sh into ~/.gradle/init.d/ (#122).
// - The plugin is applied in a repository that uses logast (logast.yaml or logast.yml in the build's root folder or in
//   the folder Gradle runs in), and for a requested logast task (a name starting with "logast": the first
//   `./gradlew logastApply` on a fresh repository). Any other build declares and resolves nothing of logast.
// - It comes from Maven Local (install.sh publishes it there). When this version is not there, or its jar (or cli's,
//   core's) is empty or no zip (an interrupted install), the build goes on without it, with one line saying so.
// - A build that applies dev.logast itself keeps its own; the plugin is applied only where the java plugin is.
// - Opt out: -Plogast.disabled, or the environment variable LOGAST_DISABLED=1.
initscript {
    def version = '@LOGAST_VERSION@'
    def start = gradle.startParameter
    def off = (start.projectProperties.containsKey('logast.disabled') && start.projectProperties['logast.disabled'] != 'false') \
            || System.getenv('LOGAST_DISABLED')
    def logastTask = start.taskNames.any {
        !it.startsWith('-') && it.substring(it.lastIndexOf(':') + 1).toLowerCase(Locale.ROOT).startsWith('logast')
    }
    // the folder Gradle runs in, and the build's root: the nearest folder upwards with a settings file
    def here = (start.projectDir ?: start.currentDir).canonicalFile
    def root = here
    while (root != null && !['settings.gradle', 'settings.gradle.kts'].any { new File(root, it).isFile() }) {
        root = root.parentFile
    }
    def optedIn = [here, root].findAll { it != null }.any { dir ->
        ['logast.yaml', 'logast.yml'].any { new File(dir, it).isFile() }
    }
    if (!off && (logastTask || optedIn)) {
        // Gradle's mavenLocal(): -Dmaven.repo.local, else ~/.m2/repository
        def m2 = System.getProperty('maven.repo.local') ?: new File(System.getProperty('user.home'), '.m2/repository').path
        def jar = new File(m2, "dev/logast/gradle-plugin/${version}/gradle-plugin-${version}.jar")
        // an empty or broken jar of the plugin or of what it needs (an interrupted install) is like a missing plugin:
        // Gradle would fail builds on it ("zip file is empty")
        def readable = { File f -> f.isFile() && f.length() > 0 && f.withInputStream { it.read() == 0x50 && it.read() == 0x4B } }
        def broken = !jar.isFile() ? null : ['gradle-plugin', 'cli', 'core', 'facts', 'kb']
                .collect { new File(m2, "dev/logast/${it}/${version}/${it}-${version}.jar") }
                .find { it.exists() && !readable(it) }
        if (jar.isFile() && broken == null) {
            repositories {
                mavenLocal()
                mavenCentral()
            }
            dependencies {
                classpath "dev.logast:gradle-plugin:${version}"
            }
        } else if (broken != null) {
            println "logast: plugin jar ${broken} is empty or broken (an interrupted install?): run logast's install.sh again; building without it"
        } else {
            println "logast: plugin ${version} not in Maven Local (${m2}): run logast's install.sh; building without it"
        }
    }
}

Class logastPlugin
try {
    logastPlugin = getClass().classLoader.loadClass('dev.logast.gradle.LogastPlugin')
} catch (ClassNotFoundException ignored) {
    return   // not wanted here, opted out, or not in Maven Local
}

gradle.afterProject { project ->
    if (project.pluginManager.hasPlugin('java') && !project.pluginManager.hasPlugin('dev.logast')) {
        project.pluginManager.apply(logastPlugin)
    }
}
