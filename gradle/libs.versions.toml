[versions]
rewrite = "8.90.4"
jackson = "2.23.0"
picocli = "4.7.7"
junit = "6.1.3"
assertj = "3.27.7"
springBoot = "4.1.2"
slf4j = "2.0.20"
jsqlparser = "5.3"
flyway = "13.12.1"
testcontainers = "2.0.4"
postgresql = "42.7.13"
hcl4j = "0.9.8"

[libraries]
hcl4j = { module = "com.bertramlabs.plugins:hcl4j", version.ref = "hcl4j" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
jsqlparser = { module = "com.github.jsqlparser:jsqlparser", version.ref = "jsqlparser" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
rewrite-bom = { module = "org.openrewrite:rewrite-bom", version.ref = "rewrite" }
rewrite-java = { module = "org.openrewrite:rewrite-java" }
rewrite-java25 = { module = "org.openrewrite:rewrite-java-25" }
rewrite-java21 = { module = "org.openrewrite:rewrite-java-21" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
