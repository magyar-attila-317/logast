[versions]
rewrite = "8.90.4"
jackson = "2.23.0"
picocli = "4.7.7"
junit = "6.1.3"
assertj = "3.27.7"
springBoot = "4.1.2"
slf4j = "2.0.20"

[libraries]
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
rewrite-bom = { module = "org.openrewrite:rewrite-bom", version.ref = "rewrite" }
rewrite-java = { module = "org.openrewrite:rewrite-java" }
rewrite-java25 = { module = "org.openrewrite:rewrite-java-25" }
rewrite-java21 = { module = "org.openrewrite:rewrite-java-21" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
